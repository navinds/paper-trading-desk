name: data check

# Run this once by hand (Actions > data check > Run workflow): it tells you whether
# Yahoo Finance and NSE answer GitHub's servers. If Yahoo does not, the desk cannot trade here.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Can GitHub reach the market data?
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request
          UA = "Mozilla/5.0 (compatible; india-trader-skill/1.0)"
          tests = [
              ("Yahoo chart (prices, bars)", "https://query2.finance.yahoo.com/v8/finance/chart/RELIANCE.NS?range=1d&interval=5m"),
              ("Yahoo chart, second host", "https://query1.finance.yahoo.com/v8/finance/chart/TCS.NS?range=1d&interval=1m"),
              ("Yahoo spark (the scan)", "https://query2.finance.yahoo.com/v7/finance/spark?symbols=RELIANCE.NS,INFY.NS&range=1d&interval=5m"),
              ("Yahoo 60 days (time machine)", "https://query2.finance.yahoo.com/v8/finance/chart/SBIN.NS?range=60d&interval=5m"),
              ("NSE board meetings feed", "https://nsearchives.nseindia.com/content/RSS/Board_Meetings.xml"),
              ("NSE corporate actions feed", "https://nsearchives.nseindia.com/content/RSS/Corporate_action.xml"),
          ]
          bad = 0
          for name, url in tests:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=30) as r:
                      body = r.read()
                  extra = ""
                  if b'"chart"' in body[:20]:
                      m = json.loads(body)["chart"]["result"][0]["meta"]
                      extra = " (%s last %s %s)" % (m.get("symbol"), m.get("regularMarketPrice"), m.get("currency"))
                  print("OK    %-30s %d bytes%s" % (name, len(body), extra))
              except Exception as e:
                  bad += 1 if name.startswith("Yahoo") else 0
                  print("FAIL  %-30s %s" % (name, e))
          print()
          print("Yahoo answers GitHub: the desk can run here." if not bad else
                "Yahoo blocks or limits GitHub's servers: the desk cannot trade here. Use another host.")
          sys.exit(1 if bad else 0)
          EOF
